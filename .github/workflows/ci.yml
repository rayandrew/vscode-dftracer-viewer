name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run compile
      # Run the server tests against a real dftracer_server, not just the stub.
      - name: Fetch the newest dftracer_server prebuild
        run: |
          set -euo pipefail
          url=$(curl -sSL "https://api.github.com/repos/rayandrew/dftracer-utils-prebuilds/releases?per_page=20" \
            | jq -r '[.[].assets[] | select(.name | endswith("-linux-x64.tar.gz"))][0].browser_download_url')
          curl -sSL -o "$RUNNER_TEMP/dft.tar.gz" "$url"
          mkdir -p "$RUNNER_TEMP/dft"
          tar xzf "$RUNNER_TEMP/dft.tar.gz" -C "$RUNNER_TEMP/dft" --strip-components=1
          echo "DFTRACER_SERVER_PATH=$RUNNER_TEMP/dft/bin/dftracer_server" >> "$GITHUB_ENV"
      # Headless VS Code needs a virtual display.
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a npm test
      - run: npx @vscode/vsce package -o dftracer-viewer.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
