name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run compile
      # Run the server tests against a real dftracer_server, not just the stub.
      - name: Fetch the develop dftracer_server prebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dft"
          gh release download develop-latest --repo llnl-asr/dftracer-utils \
            --pattern '*-linux-x86_64.tar.gz' --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP"/dftracer-utils-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP/dft"
          echo "DFTRACER_SERVER_PATH=$RUNNER_TEMP/dft/bin/dftracer_server" >> "$GITHUB_ENV"
      # Headless VS Code needs a virtual display.
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a npm test
      - run: npx @vscode/vsce package -o dftracer-viewer.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
